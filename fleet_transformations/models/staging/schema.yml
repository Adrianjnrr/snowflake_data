version: 2

models:
  - name: stg_drivers_clean
    description: "Cleaned driver data."

    columns:
      - name: driver_id
        description: "Unique identifier for each driver."
        tests:
          - unique
          - not_null

      - name: hire_date
        description: "Date the driver was hired."
        tests:
          - not_null

      - name: date_of_birth
        description: "Driver's date of birth."
        tests:
          - not_null

  - name: stg_trucks_clean
    description: "Cleaned truck data."

    columns:
      - name: trip_id
        description: "Unique identifier for each trip."
        tests:
          - unique
          - not_null          

      - name: dispatch_date
        description: "Date the trip was dispatched."
        tests:
          - not_null
  - name: stg_loads_clean
    description: "Cleaned loads data."

    columns:
      - name: load_id
        description: "Unique identifier for each load."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Unique identifier for each customer."
        tests:
        - not_null

      - name: load_date
        description: "Date the load was created."
        tests:
          - not_null
  - name: stg_trips_clean
    description: "Cleaned trips data."
    columns:
      - name: trip_id
        description: "Unique identifier for each trip."
        tests:
          - unique
          - not_null

      - name: dispatch_date
        description: "Date the trip was dispatched."
        tests:
          - not_null
      
  - name: stg_trailers_clean
    description: "Cleaned trailers data."

    columns:
      - name: trailer_id
        description: "Unique identifier for each trailer."
        tests:
          - unique
          - not_null

      - name: vin
        description: "Vehicle Identification Number of the trailer."
        tests:
          - unique
          - not_null

      - name: trailer_number
        description: "Unique number assigned to the trailer."
        tests:
          - not_null

  - name: stg_safety_incidents_clean
    description: "Cleaned safety incidents data."

    columns:
      - name: incident_id
        description: "Unique identifier for each safety incident."
        tests:
          - unique
          - not_null

      - name: incident_date
        description: "Date the safety incident occurred."
        tests:
          - not_null

      - name: driver_id
        description: "Unique identifier for the driver involved in the incident."
        tests:
          - not_null  

      - name: incident_type
        description: "Type of safety incident."
        tests:
          - not_null

      - name: description
        description: "Detailed description of the safety incident."
        tests:
          - not_null


      - name: injury_flag
        description: "Flag indicating if the incident resulted in an injury."
        tests:
          - not_null

      - name: preventable_flag
        description: "Flag indicating if the incident was preventable."
        tests:
          - not_null                      

  - name: stg_routes_clean
    description: "Cleaned routes data."

    columns:
      - name: route_id
        description: "Unique identifier for each route."
        tests:
          - unique
          - not_null

      - name: origin_state
        description: "Starting location of the route."
        tests:
          - not_null

      - name: destination_city
        description: "Ending location of the route."
        tests:
          - not_null

      - name: destination_state
        description: "Ending location of the route."
        tests:
          - not_null

      - name: typical_transit_days
        description: "Typical number of days for transit on this route."
        tests:
          - not_null

      - name: typical_distance_miles
        description: "Typical distance in miles for this route."
        tests:
          - not_null    
                  
  - name: stg_maintenance_records_clean
    description: "Cleaned maintenance records data."

    columns:
      - name: maintenance_id
        description: "Unique identifier for each maintenance record."
        tests:
          - unique
          - not_null

      - name: truck_id
        description: "Unique identifier for the truck associated with the maintenance record."
        tests:
          - not_null

      - name: maintenance_date
        description: "Date the maintenance was performed."
        tests:
          - not_null

      - name: maintenance_type
        description: "Type of maintenance performed."
        tests:
          - not_null

      - name: labor_cost
        description: "Cost of the labor for the maintenance."
        tests:
          - not_null         
      - name: total_cost
        description: "Total cost of the maintenance, including parts and labor."
        tests:
          - not_null

      - name: facility_location
        description: "Location of the facility where the maintenance was performed."
        tests:
          - not_null    

      - name: service_description
        description: "Description of the maintenance service performed."
        tests:
          - not_null    


  - name: stg_fuel_purchases_clean
    description: "Cleaned fuel purchases data."

    columns:
      - name: fuel_purchase_id
        description: "Unique identifier for each fuel purchase."
        tests:
          - unique
          - not_null

      - name: truck_id
        description: "Unique identifier for the truck associated with the fuel purchase."
        tests:
          - not_null

      - name: purchase_date
        description: "Date the fuel was purchased."
        tests:
          - not_null

      - name: gallons
        description: "Number of gallons purchased."
        tests:
          - not_null

      - name: total_cost
        description: "Total cost of the fuel purchase."
        tests:
          - not_null

      - name: location_city
        description: "City of the fuel station where the purchase was made."
        tests:
          - not_null         
  
      - name: price_per_gallon
        description: "Price per gallon of fuel purchased."
        tests:
          - not_null

      - name: fuel_card_number
        description: "Fuel card number used for the purchase."
        tests:
          - not_null    


  - name: stg_facilities_clean
    description: "Cleaned facilities data."

    columns:
      - name: facility_id
        description: "Unique identifier for each facility."
        tests:
          - unique
          - not_null

      - name: facility_name
        description: "Name of the facility."
        tests:
          - not_null

      - name: city
        description: "City where the facility is located."
        tests:
          - not_null

      - name: state
        description: "State where the facility is located."
        tests:
          - not_null

      - name: facility_type
        description: "Type of the facility (e.g., warehouse, maintenance shop)."
        tests:
          - not_null

      - name: latitude
        description: "Latitude coordinate of the facility."
        tests:
          - not_null

      - name: longitude
        description: "Longitude coordinate of the facility."
        tests:
          - not_null

      - name: dock_doors
        description: "Number of dock doors available at the facility."
        tests:
          - not_null       
  - name: stg_weather_clean
    description: "Cleaned weather data."
    columns:
      - name: weather_time 
        description: "Timestamp of the weather data associated with the facility."
        tests:
          - not_null

      - name: facility_id
        description: "Unique identifier for the facility associated with the weather data."
        tests:
          - not_null
              

      - name: precipitation 
        description: "Amount of precipitation recorded at the facility's location."
        tests:
          - not_null

      - name: temperature 
        description: "Temperature recorded at the facility's location."
        tests:
          - not_null                           

  - name: stg_driver_monthly_metrics_clean
    description: "Cleaned driver monthly metrics data."
    columns:
      - name: driver_id
        description: "Unique identifier for each driver."
        tests:
          - not_null

      - name: month
        description: "Month for which the metrics are recorded."
        tests:
          - not_null

      - name: trips_completed
        description: "Number of trips completed by the driver."
        tests:
          - not_null

      - name: total_miles
        description: "Total miles driven by the driver."
        tests:
          - not_null

      - name: total_revenue
        description: "Total revenue generated by the driver."
        tests:
          - not_null

      - name: average_mpg
        description: "Average miles per gallon for the driver."
        tests:
          - not_null

      - name: total_fuel_gallons
        description: "Total gallons of fuel consumed by the driver."
        tests:
          - not_null

      - name: on_time_delivery_rate
        description: "Rate of on-time deliveries made by the driver."
        tests:
          - not_null
          
      - name: average_idle_hours
        description: "Average hours the driver was idle per month."
        tests:
          - not_null


  - name: stg_delivery_events_clean
    description: "Cleaned delivery events data."

    columns:
      - name: event_id
        description: "Unique identifier for event."
        tests:
          - unique
          - not_null

      - name: scheduled_datetime
        description: "Datetime for a scheduled event."
        tests:
          - not_null

  - name: stg_customers_clean
    description: "Cleaned customers data."

    columns:
      - name: customer_id
        description: "Unique identifier for event."
        tests:
          - unique
          - not_null

      - name: customer_name
        description: "name of customers."
        tests:
          - not_null   

      - name: customer_type
        description: "customers type"
        tests:
          - not_null       

      - name: credit_terms_days
        description: "credit terms date of customers."
        tests:
          - not_null  


      - name: primary_freight_type
        description: "customers freight type."
        tests:
          - not_null    

      - name: account_status
        description: "status of customers."
        tests:
          - not_null                

      - name: contract_start_date
        description: "customers start date."
        tests:
          - not_null       

      - name: annual_revenue_potential
        description: "annual revenue of customers."
        tests:
          - not_null       